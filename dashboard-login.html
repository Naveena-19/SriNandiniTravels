<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Owner / Driver Login | Sri Nandini Travels</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="dashboard.css" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="login-shell">

  <main class="login-card">

    <div class="brand-login">
      <div class="brand-mark">SN</div>

      <div>
        <strong>Sri Nandini Travels</strong>
        <small>Owner / Driver Portal</small>
      </div>
    </div>

    <div class="login-heading">
      <p class="eyebrow">Private access</p>

      <h1>Owner / Driver Login</h1>

      <p>
        This area is only for Sri Nandini Travels owner and drivers
        to manage customer bookings.
      </p>
    </div>

    <form id="loginForm" class="login-form">

      <label>
        <span>Username</span>

        <input
          id="username"
          type="text"
          autocomplete="username"
          placeholder="Enter username"
          required
        />
      </label>

      <label>
        <span>Password</span>

        <input
          id="password"
          type="password"
          autocomplete="current-password"
          placeholder="Enter password"
          required
        />
      </label>

      <button
        id="loginButton"
        class="btn btn-primary full-width"
        type="submit"
      >
        Login
      </button>

      <p id="loginError" class="login-error"></p>

    </form>

    <a class="back-link" href="index.html">
      ← Back to Sri Nandini Travels
    </a>

  </main>

  <script>

    const SUPABASE_URL =
      "https://oktndxyfucqibnjrnepa.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_NZGtnaEy9a2AD71b6VMqKg_78PHPEck";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );

    const loginForm = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");
    const loginError = document.getElementById("loginError");

    loginForm.addEventListener("submit", async (event) => {

      event.preventDefault();

      loginError.textContent = "";

      const username =
        document.getElementById("username").value.trim();

      const password =
        document.getElementById("password").value;

      if (!username || !password) {
        loginError.textContent =
          "Please enter username and password.";

        return;
      }

      loginButton.disabled = true;
      loginButton.textContent = "Logging in...";

      try {

        /*
         * Username is converted internally to the private
         * Supabase Auth email.
         *
         * Driver still only sees username/password.
         */

        const email =
          username.toLowerCase() + "@dashboard.local";

        const { data, error } =
          await supabaseClient.auth.signInWithPassword({
            email,
            password
          });

        if (error) {
          throw error;
        }

        if (!data.session) {
          throw new Error("Login session was not created.");
        }

        /*
         * Verify that this authenticated account actually
         * belongs to an active driver.
         */

        const { data: driver, error: driverError } =
          await supabaseClient
            .from("drivers")
            .select("id, name, driver_id, is_active")
            .eq("auth_user_id", data.user.id)
            .single();

        if (driverError || !driver) {

          await supabaseClient.auth.signOut();

          throw new Error(
            "This account is not registered as a driver."
          );
        }

        if (!driver.is_active) {

          await supabaseClient.auth.signOut();

          throw new Error(
            "This driver account is currently inactive."
          );
        }

        sessionStorage.setItem(
          "sn_driver_name",
          driver.name
        );

        sessionStorage.setItem(
          "sn_driver_id",
          driver.id
        );

        window.location.href = "dashboard.html";

      } catch (error) {

        console.error(error);

        loginError.textContent =
          error.message ||
          "Invalid username or password.";

        loginButton.disabled = false;
        loginButton.textContent = "Login";
      }

    });

  </script>

</body>
</html>
